<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品设计 01 | 详情</title>
    <!-- 强制不缓存，和首页配套 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css">
    <style>
/* 通栏全屏首图 */
.banner-full {
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    margin-right: calc(-50vw + 50%);
    margin-top: 2rem;
    margin-bottom: 6rem;
}
.banner-full img {
    width: 100%;
    display: block;
    object-fit: cover;
}
@media (max-width:768px){
    .banner-full {
        margin-bottom: 4rem;
    }
}
body {
  background-color: #f8f8f8; /* 浅灰色，柔和不刺眼 */
}
        /* 详情页项目简介专用排版，匹配截图左右分栏风格 */
        .project-intro {
            max-width: 1400px;
            margin: 6rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 4rem;
        }
        .intro-title h2 {
            font-size: 48px;
            font-weight: 600;
            margin: 0;
        }
        .intro-text h3 {
            font-size: 20px;
            font-weight: 500;
            margin: 0 0 2rem 0;
        }
        .intro-text p {
            line-height: 1.7;
            font-size: 15px;
            color: #333;
            margin: 0.6rem 0;
        }
        /* 底部信息四栏布局：客户/年份/设计师/贡献 */
        .project-meta {
            max-width: 1400px;
            margin: 8rem auto 4rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        .meta-block h4 {
            font-size: 14px;
            font-weight: 400;
            color: #666;
            margin-bottom: 1rem;
        }
        .meta-block p {
            line-height: 1.6;
            margin: 0;
        }
        /* ========== 新增左右跳转容器样式 ========== */
        .project-nav-bottom {
            max-width: 1400px;
            margin: 0 auto 6rem;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .project-nav-bottom.show {
            opacity: 1;
            visibility: visible;
        }
        .project-nav-bottom a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #000;
            font-size: 28px;
            font-weight: 500;
            opacity: 0.85;
            transition: opacity 0.25s ease;
        }
        .project-nav-bottom a:hover {
            opacity: 1;
        }
        /* 左边上一页箭头翻转 */
        .prev-link span {
            transform: rotate(180deg);
            display: inline-block;
        }
        /* 移动端全局修复：导航竖排、顶部留白、内容左右边距 */
        @media (max-width:768px){
            /* 导航修复，解决挤压+遮挡 */
            body {
                padding-top: 140px !important;
            }
            .header {
                flex-direction: column;
                gap: 14px;
                padding: 16px 20px !important;
            }
            .nav {
                display: flex;
                justify-content: center;
                gap: 36px;
            }
            .nav a {
                margin-left: 0 !important;
            }
            /* 详情自有布局适配 */
            .project-intro{
                grid-template-columns: 1fr;
                gap:1.5rem;
                padding: 0 1rem;
            }
            .project-meta{
                grid-template-columns: repeat(2,1fr);
                padding: 0 1rem;
            }
            .intro-title h2{
                font-size:36px;
            }
            .project-nav-bottom a {
                font-size: 20px;
            }
            .project-nav-bottom {
                flex-direction: column;
                gap: 2rem;
            }
            .detail-container {
                padding: 20px 1rem !important;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">侯昌昌</a></div>
        <nav class="nav">
            <a href="about.html">About</a>
            <a href="index.html#news">News</a>
            <a href="index.html#works">Works</a>
        </nav>
    </header>

    <!-- 通栏全屏首图 -->
    <div class="banner-full scroll-fade">
        <img src="V12.jpg" alt="E20 机器人吸尘器全景图">
    </div>

    <div class="detail-container">
        <div class="detail-header scroll-fade">
            <h1 class="detail-title">产品设计 01</h1>
            <p class="detail-subtitle">2023 - 2025 / 工业设计</p>
        </div>

        <!-- 文字介绍区域 -->
        <div class="project-intro scroll-fade">
            <div class="intro-title">
                <h2>v20</h2>
            </div>
            <div class="intro-text">
                <h3>V口电池</h3>
                <p>个人</p>
                <p></p>
            </div>
        </div>

        <!-- 底部四栏信息 -->
        <div class="project-meta scroll-fade">
            <div class="meta-block">
                <h4>个人</h4>
                <p></p>
            </div>
            <div class="meta-block">
                <h4>年份</h4>
                <p>2023 - 2025</p>
            </div>
            <div class="meta-block">
                <h4>设计师</h4>
                <p>侯昌昌<br><br></p>
            </div>
            <div class="meta-block">
                <h4>贡献</h4>
                <p>项目负责人<br>概念开发<br>工业设计<br>用户体验<br>颜色、材质与表面处理<br>制造设计</p>
            </div>
        </div>

        <!-- 剩余全部产品大图 全部添加 scroll-fade 实现下拉渐入 -->
        <div class="detail-images">
            <img src="v2_画板 1.jpg" alt="作品大图" class="scroll-fade">
            <img src="V10_画板 1.jpg" alt="作品大图" class="scroll-fade">
            <img src="V11.jpg" alt="作品大图" class="scroll-fade">
            <img src="v14.jpg" alt="作品大图" class="scroll-fade">
            <img src="v55_画板 1.jpg" alt="作品大图" class="scroll-fade">
            <img src="v13.jpg" alt="作品大图" class="scroll-fade">
            <img src="v3_画板 1.jpg" alt="作品大图" class="scroll-fade">
            <img src="v8_画板 1.jpg" alt="作品大图" class="scroll-fade">
        </div>

        <!-- 页面底部 左右前后项目跳转 -->
        <div class="project-nav-bottom">
            <!-- 左侧：回到上一个项目 project1 -->
            <a href="project6.html" class="prev-link">
                <span>></span>
                140W氮化镓充电器
            </a>
            <!-- 右侧：下一个项目 project3 -->
            <a href="project1.html" class="next-link">
                FlexPanel多角度折叠式锂电工作灯
                <span>></span>
            </a>
        </div>
    </div>

    <!-- 滚动动效JS（已修改选择器匹配project-nav-bottom） -->
    <script src="script.js"></script>
    <script>
        // 绑定左右跳转容器
        const navWrap = document.querySelector('.project-nav-bottom');
        window.addEventListener('scroll', () => {
            // 距离底部200px时显示
            const scrollBottom = document.documentElement.scrollHeight - document.documentElement.scrollTop - document.documentElement.clientHeight;
            if (scrollBottom < 200) {
                navWrap.classList.add('show');
            } else {
                navWrap.classList.remove('show');
            }
        })
    </script>
</body>
</html>
