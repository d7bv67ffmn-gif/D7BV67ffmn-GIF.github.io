    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== 1:1复刻 leapx.cn 启动Splash动画 ========== */
        /* 全屏黑色遮罩层 */
        .splash-screen {
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            /* 整体遮罩淡出缓动，LeapX柔和慢出 */
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* Logo入场：缩放+上浮淡入，完全匹配LeapX标志动效 */
        .splash-logo {
            width: 240px;
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-screen.load-ready .splash-logo {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        /* 移动端缩小Logo */
        @media(max-width:768px){
            .splash-logo {
                width: 160px;
            }
        }
        /* 遮罩存在时锁定滚动 */
        body.splash-active {
            overflow: hidden;
        }
        /* 首页内容初始低透明度，遮罩消失后淡入，和LeapX分层质感一致 */
        .page-wrap {
            opacity: 0;
            transition: opacity 0.9s ease 0.3s;
        }
        .page-wrap.show-content {
            opacity: 1;
        }

        /* 首页顶部全屏轮播大图样式 */
        .hero-banner {
            width: 100%;
            height: 90vh;
            overflow: hidden;
            position: relative;
            margin-top: 80px;
        }
        /* 淡入淡出核心样式 */
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .hero-banner img.active {
            opacity: 1;
        }
        /* 作品区域：桌面强制一行2个 */
        #works {
            margin-top: 8rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
        }
        /* 移动端适配 */
        @media (max-width:768px){
            .hero-banner {
                height: 60vh;
                margin-top: 130px;
            }
            #works {
                grid-template-columns: 1fr;
                padding: 0 1rem;
            }
            .header {
                flex-direction: column;
                gap: 14px;
                padding: 16px 20px !important;
            }
            .nav {
                display: flex;
                gap: 36px;
            }
            .nav a {
                margin-left: 0 !important;
            }
        }
    </style>
</head>

    <script src="script.js"></script>
    <script>
        // ========== LeapX同款启动页动画逻辑（已优化时序） ==========
        window.addEventListener('load', function(){
            const splash = document.querySelector('.splash-screen');
            const body = document.body;
            const pageWrap = document.querySelector('.page-wrap');

            // 页面资源加载完毕 → Logo上浮缩放淡入
            splash.classList.add('load-ready');

            // 停留1.6秒（和LeapX时长一致，不长不拖沓）
            setTimeout(() => {
                // 黑屏整体淡出
                splash.classList.add('fade-out');
                // 同步让首页内容淡入显现
                pageWrap.classList.add('show-content');
                // 动画结束解除滚动锁定
                setTimeout(() => {
                    body.classList.remove('splash-active');
                }, 700);
            }, 1600);
        })

        // ========== 原有轮播逻辑（完全保留，无冲突） ==========
        const slides = document.querySelectorAll('.banner-slide');
        let currentIndex = 0;
        let autoPlayTimer;

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            slides[index].classList.add('active');
        }
        function autoNext() {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        }
        function startAutoPlay() {
            autoPlayTimer = setInterval(autoNext, 3000);
        }
        window.addEventListener('load', () => {
            showSlide(currentIndex);
            startAutoPlay();
        })
    </script>
